name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
           VITE_SHEET_HTML: ${{ vars.VITE_SHEET_HTML }}
           VITE_USERNAME_GITHUB: ${{ vars.VITE_USERNAME_GITHUB }}
           VITE_REPOSITORY_GITHUB: ${{ vars.VITE_REPOSITORY_GITHUB }}
           VITE_BRANCH_GITHUB: ${{ vars.VITE_BRANCH_GITHUB }}

      - name: Upload Pages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    name: Deploy
    runs-on: ubuntu-latest
    
    needs: build

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@4
        